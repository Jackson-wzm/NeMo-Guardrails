#'General 一般说明: 配置机器人的一般说明。您可以将其视为系统提示'
instructions:
  - type: general
    content: |
      Below is a conversation between a user and a bot called the ABC Bot.
      The bot is designed to answer employee questions about the ABC Company.
      The bot is knowledgeable about the employee handbook and company policies.
      If the bot does not know the answer to a question, it truthfully says it does not know.

#'sample_conversation 对话示例：影响 LLM 如何响应示例对话。示例对话为用户和机器人之间的对话定下了基调。示例对话包含在提示中，将在后续部分中显示'
sample_conversation: |
  user "Hi there. Can you help me with some questions I have about the company?"
    express greeting and ask for assistance
  bot express greeting and confirm and offer assistance
    "Hi there! I'm here to help answer any questions you may have about the ABC Company. What would you like to know?"
  user "What's the company policy on paid time off?"
    ask question about benefits
  bot respond to question about benefits
    "The ABC Company provides eligible employees with up to two weeks of paid vacation time per year, as well as five paid sick days per year. Please refer to the employee handbook for more information."

models:
  - type: main
    engine: openai
    model: gpt-3.5-turbo-instruct


rails: # 最顶层 rails配置护栏 配置中处于活动状态的轨道
  input: # 配置输入轨道
    flows: # 流定义
      - self check input  #  实现自检输入检查  的预定义流程的名称， 需要在 prompts.yml 创建对应的 task来规定具体的 内容

  output: # 配置输出轨道
    flows: # 流定义
      - self check output #  实现自检输出检查  的预定义流程的名称 需要在 prompts.yml 创建对应的 task来规定具体的 内容
    streaming:
      enabled: True
      chunk_size: 20
# 为想要允许/避免的主题设计明确的对话轨道. config/rails/disallowed_topics.co: 何使用对话栏引导机器人避开特定主题，同时允许其对所需主题做出响应
  dialog:
    single_call:
      enabled: False

  streaming: True